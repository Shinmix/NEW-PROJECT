<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Boring Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="container site-nav">
            <a class="brand" href="landing.html">Boring Website</a>
            <nav>
                <ul>
                    <li><a href="landing.html">Home</a></li>
                    <li><a class="active" href="login.html">Login</a></li>
                    <li><a href="profile.html">Profile</a></li>
                    <li><a href="lobby.html">Lobby</a></li>
                </ul>
            </nav>
            <a class="button button-secondary" href="landing.html">Back home</a>
        </div>
    </header>

    <main class="container">
        <section class="section">
            <div class="form-card">
                <h1>Login</h1>
                <p>Enter your credentials to access the site.</p>
                <form>
                    <div class="field">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="jane.doe">
                    </div>
                    <div class="field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="••••••••">
                    </div>
                    <div class="login-actions">
                        <button class="button button-primary" type="button" onclick="window.location='landing.html'">Sign in</button>
                        <a class="button button-secondary" href="lobby.html">Continue as guest</a>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <footer class="footer">
        Secure access, simple experience.
    </footer>
</body>
</html>
